<!doctype html>
<!-- Dev-only: finds the painted face landmarks in model coordinates.

Renders a flat-lit orthographic front view over a known box, then labels the
connected dark blobs. The pupils, the nose and the mouth are filled shapes; the
glasses frame is one big thin outline, told apart by how little of its bounding
box it fills. Run it on the current model first: it has to reproduce the
numbers already written in rig.js before its numbers for a new model mean
anything. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Measure</title>
    <style>body{margin:0;background:#0b1020;color:#e6edf7;font:12px/1.5 ui-monospace,monospace}pre{padding:10px;white-space:pre}</style>
  </head>
  <body>
    <pre id="out">measuring…</pre>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'

      const query = new URLSearchParams(location.search)
      const url = query.get('model') || '/models/zinvest-bear-v6.glb'
      const BOX = (query.get('box') || '-0.35,0.35,0.90,1.45').split(',').map(Number)
      const [x0, x1, y0, y1] = BOX
      const SIZE = 1400

      const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(url)
      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true })
      renderer.setSize(SIZE, Math.round((SIZE * (y1 - y0)) / (x1 - x0)), false)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      const height = renderer.domElement.height
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xffffff)
      scene.add(new THREE.AmbientLight(0xffffff, 3.1)) // flat, so shading makes no dark pixels
      scene.add(gltf.scene)
      const camera = new THREE.OrthographicCamera(x0, x1, y1, y0, 0.01, 30)
      camera.position.set(0, 0, 6)
      camera.lookAt(0, 0, 0)
      renderer.render(scene, camera)

      const buffer = new Uint8Array(SIZE * height * 4)
      renderer.getContext().readPixels(0, 0, SIZE, height, 6408, 5121, buffer) // RGBA, UNSIGNED_BYTE
      // readPixels starts at the bottom row, which is what we want: +y is up.

      const luma = new Float32Array(SIZE * height)
      for (let i = 0; i < SIZE * height; i++) {
        luma[i] = 0.2126 * buffer[i * 4] + 0.7152 * buffer[i * 4 + 1] + 0.0722 * buffer[i * 4 + 2]
      }

      const toModel = (px, py) => [x0 + ((px + 0.5) / SIZE) * (x1 - x0), y0 + ((py + 0.5) / height) * (y1 - y0)]

      function blobs(test) {
        const seen = new Uint8Array(SIZE * height)
        const found = []
        for (let start = 0; start < SIZE * height; start++) {
          if (seen[start] || !test(start)) continue
          const stack = [start]
          seen[start] = 1
          let sx = 0, sy = 0, n = 0, minX = SIZE, maxX = 0, minY = height, maxY = 0
          while (stack.length) {
            const at = stack.pop()
            const px = at % SIZE, py = (at / SIZE) | 0
            sx += px; sy += py; n++
            if (px < minX) minX = px
            if (px > maxX) maxX = px
            if (py < minY) minY = py
            if (py > maxY) maxY = py
            for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nx = px + dx, ny = py + dy
              if (nx < 0 || ny < 0 || nx >= SIZE || ny >= height) continue
              const next = ny * SIZE + nx
              if (seen[next] || !test(next)) continue
              seen[next] = 1
              stack.push(next)
            }
          }
          if (n < 400) continue
          const [cx, cy] = toModel(sx / n, sy / n)
          found.push({
            n,
            centre: [cx, cy],
            width: ((maxX - minX + 1) / SIZE) * (x1 - x0),
            height: ((maxY - minY + 1) / height) * (y1 - y0),
            fill: n / ((maxX - minX + 1) * (maxY - minY + 1)),
          })
        }
        return found.sort((a, b) => b.n - a.n)
      }

      const fmt = (b, label) =>
        `${label.padEnd(10)} x ${b.centre[0].toFixed(3).padStart(7)}  y ${b.centre[1].toFixed(3).padStart(6)}` +
        `   ${b.width.toFixed(3)}×${b.height.toFixed(3)}  fill ${b.fill.toFixed(2)}  px ${b.n}`

      const yellow = blobs((i) => buffer[i * 4] > 150 && buffer[i * 4 + 1] > 115 && buffer[i * 4 + 2] < 115)
      const dark = blobs((i) => luma[i] < 70)
      const brow = blobs((i) => luma[i] >= 70 && luma[i] < 205 && Math.abs(buffer[i * 4] - buffer[i * 4 + 2]) < 70)

      const lines = [`model ${url}`, `box   x ${x0}…${x1}   y ${y0}…${y1}`, '', 'dark shapes (pupils, nose, mouth, frame):']
      dark.slice(0, 8).forEach((b, i) => lines.push('  ' + fmt(b, `#${i}`)))
      lines.push('', 'mid-tone shapes (brows):')
      brow.slice(0, 6).forEach((b, i) => lines.push('  ' + fmt(b, `#${i}`)))
      lines.push('', 'yellow shapes (the growth arrow):')
      yellow.slice(0, 4).forEach((b, i) => lines.push('  ' + fmt(b, `#${i}`)))
      document.getElementById('out').textContent = lines.join('\n')
      document.title = 'done'
    </script>
  </body>
</html>
