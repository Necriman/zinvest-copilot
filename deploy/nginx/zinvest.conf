# PRODUCTION bare-metal / systemd server block.
#   * Terminates TLS, redirects HTTP->HTTPS, emits HSTS (the single source —
#     Django sets SECURE_SSL_REDIRECT=False / SECURE_HSTS_SECONDS=0).
#   * Upstream = the Gunicorn unix socket from deploy/systemd/gunicorn.service.
#   * Serves the host-built SPA (frontend/dist) + Django static/media.
#   * Security headers come from snippets/ (see security-headers.conf).
# Replace the cert paths and server_name with your real values.

upstream django {
    server unix:/run/auth-app/gunicorn.sock;
}

# Brake on the sign-in endpoints: the app already limits per account and per
# address, this stops a flood before it reaches Django at all. Refreshing a
# session is the busiest call here (once per tab every 15 minutes), so the
# allowance is generous; a password-guessing run is not.
limit_req_zone $binary_remote_addr zone=zinvest_auth:10m rate=60r/m;
limit_req_status 429;

server_tokens off;

# HTTP -> HTTPS (single redirect source).
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;   # PLACEHOLDER
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;      # PLACEHOLDER
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include snippets/security-headers.conf;

    client_max_body_size 10m;

    root /opt/zinvest/frontend/dist;      # host-built SPA
    index index.html;

    location /static/ { alias /opt/zinvest/backend/staticfiles/; access_log off; expires 30d; }

    # User uploads: inert, and never under the app's own policy.
    location /media/ {
        alias /opt/zinvest/backend/media/;
        access_log off;
        include snippets/media-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Signing in, refreshing, registering, password resets.
    location /api/auth/ {
        limit_req zone=zinvest_auth burst=30 nodelay;
        include snippets/proxy.conf;
        proxy_set_header X-Forwarded-Proto https;   # TLS always terminates here
        proxy_pass http://django;
    }

    location /api/ {
        include snippets/proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://django;
    }

    # Django's own admin — superusers only; it needs a looser policy than the SPA.
    location /admin/ {
        limit_req zone=zinvest_auth burst=30 nodelay;
        include snippets/proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
        include snippets/django-admin-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://django;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
