# Nginx config baked into the compose `nginx` image. Upstream = web:8000 (TCP).
# Plain HTTP :80 for a frictionless local demo. For prod parity, uncomment the
# :443 block (mount deploy/nginx/certs) and set REFRESH_COOKIE_SECURE unset.

upstream django {
    server web:8000;
}

# See zinvest.conf: a brake on the sign-in endpoints, generous enough for the
# once-per-tab session refresh.
limit_req_zone $binary_remote_addr zone=zinvest_auth:10m rate=60r/m;
limit_req_status 429;

server_tokens off;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # SPA + its /assets are baked into the image.
    root /usr/share/nginx/html;
    index index.html;

    # Django-collected static (admin) + media come from shared volumes.
    location /static/ { alias /usr/share/nginx/static/; access_log off; expires 30d; }
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        include /etc/nginx/snippets/media-headers.conf;
    }

    # API + admin -> gunicorn. Path preserved EXACTLY (refresh cookie is scoped
    # to /api/auth/refresh, so it must never be rewritten).
    location /api/auth/ {
        limit_req zone=zinvest_auth burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }
    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }
    location /admin/ {
        limit_req zone=zinvest_auth burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/django-admin-headers.conf;
        proxy_pass http://django;
    }

    # SPA history fallback LAST so it never shadows /api, /admin, /static, /media.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

