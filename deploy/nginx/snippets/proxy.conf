# Shared proxy headers — the single source of truth for the forwarded-header
# trust chain that config/settings.py (SECURE_PROXY_SSL_HEADER) and
# gunicorn.conf.py (forwarded_allow_ips) depend on. Included by both server
# blocks. Getting X-Forwarded-Proto wrong drops the Secure refresh cookie.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_redirect off;
