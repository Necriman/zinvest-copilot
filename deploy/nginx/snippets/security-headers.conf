# Security headers for the app (SPA + /api). Included at SERVER level so every
# response carries them — nginx only inherits add_header into a location that
# declares none of its own, so a location that sets its own headers (see
# /media/ and /admin/) must repeat everything it needs.
#
# The policy was verified against the production build in a real browser
# (every page, light and dark). Two allowances the 3D mascot needs:
#   'wasm-unsafe-eval'  three.js compiles the texture transcoder to WebAssembly
#   connect-src blob:   ...and then reads the decoded textures back from blob URLs
# 'unsafe-inline' for styles covers Vue's style="" bindings (progress bars,
# rail widths); scripts stay strict, which is what stops injected code.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
