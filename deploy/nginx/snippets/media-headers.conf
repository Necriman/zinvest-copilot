# Uploaded files (avatars, post images). They come from users, so they are
# served as inert data: no scripts, no frames, no MIME sniffing, and nothing
# about the app leaks in the referrer. Add HSTS alongside this include on a
# TLS server block — a location with its own add_header inherits none.
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
